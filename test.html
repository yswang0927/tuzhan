<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLayers 绘制多边形并获取坐标</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; }
    #map { width: 100%; height: 70vh; }
    .toolbar {
      padding: 12px 16px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #e8e8e8; }
    button.active { background: #1890ff; color: #fff; border-color: #1890ff; }
    #coords {
      padding: 16px;
      background: #fff;
      max-height: 30vh;
      overflow: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .tip { color: #666; font-size: 13px; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="drawBtn">开始绘制多边形</button>
    <button id="clearBtn">清除</button>
    <span class="tip">点击按钮后在地图上单击添加顶点，双击结束绘制</span>
  </div>
  <div id="map"></div>
  <div id="coords">尚未绘制多边形...</div>

  <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
  <script>
    // 1. 创建矢量图层，用于存放绘制的多边形
    const source = new ol.source.Vector();
    const vectorLayer = new ol.layer.Vector({
      source: source,
      style: new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(24, 144, 255, 0.2)' }),
        stroke: new ol.style.Stroke({ color: '#1890ff', width: 2 }),
        image: new ol.style.Circle({
          radius: 5,
          fill: new ol.style.Fill({ color: '#1890ff' })
        })
      })
    });

    // 2. 创建地图（这里用 OSM，你也可以换成自己的底图）
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.OSM()
        }),
        vectorLayer
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([116.397, 39.908]), // 北京
        zoom: 12
      })
    });

    // 3. 绘制交互
    let drawInteraction = null;

    function startDraw() {
      // 如果已经有绘制交互，先移除
      if (drawInteraction) {
        map.removeInteraction(drawInteraction);
      }

      drawInteraction = new ol.interaction.Draw({
        source: source,
        type: 'Polygon'
      });

      // 绘制完成时触发
      drawInteraction.on('drawend', function (evt) {
        const feature = evt.feature;
        const geometry = feature.getGeometry();

        // 获取多边形坐标（地图当前投影，通常是 EPSG:3857）
        const coords3857 = geometry.getCoordinates()[0]; // 外环

        // 转换为经纬度（EPSG:4326）
        const coords4326 = coords3857.map(coord => {
          return ol.proj.toLonLat(coord); // [经度, 纬度]
        });

        // 注意：OpenLayers 的多边形坐标会自动闭合（最后一个点等于第一个点）
        // 如果只想要不重复的顶点，可以去掉最后一个点：
        const uniqueCoords = coords4326.slice(0, -1);

        // 显示坐标
        showCoordinates(uniqueCoords);

        // 控制台输出
        console.log('多边形顶点经纬度：', uniqueCoords);

        // 绘制结束后移除绘制交互（可选）
        map.removeInteraction(drawInteraction);
        drawInteraction = null;
        document.getElementById('drawBtn').classList.remove('active');
      });

      map.addInteraction(drawInteraction);
      document.getElementById('drawBtn').classList.add('active');
    }

    // 4. 显示坐标
    function showCoordinates(coords) {
      let html = `共 ${coords.length} 个顶点：\n\n`;
      coords.forEach((c, i) => {
        html += `顶点 ${i + 1}:  经度 ${c[0].toFixed(6)},  纬度 ${c[1].toFixed(6)}\n`;
      });
      html += `\nJSON 格式：\n${JSON.stringify(coords, null, 2)}`;
      document.getElementById('coords').textContent = html;
    }

    // 5. 清除
    function clear() {
      source.clear();
      if (drawInteraction) {
        map.removeInteraction(drawInteraction);
        drawInteraction = null;
      }
      document.getElementById('drawBtn').classList.remove('active');
      document.getElementById('coords').textContent = '尚未绘制多边形...';
    }

    // 绑定按钮
    document.getElementById('drawBtn').addEventListener('click', startDraw);
    document.getElementById('clearBtn').addEventListener('click', clear);
  </script>
</body>
</html>
